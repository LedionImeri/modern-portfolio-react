      @keyframes ld-rise { to { transform: none; } }
      @keyframes ld-slide { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) { #loader .ld-name span { animation: none; transform: none; } #loader .ld-bar::after { animation: none; width: 100%; } }
